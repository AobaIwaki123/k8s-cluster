apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taite-board-preview
  namespace: argocd
spec:
  generators:
    - pullRequest:
        github:
          owner: AobaIwaki123
          repo: taite-board
  template:
    metadata:
      name: 'taite-board-pr-{{number}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/AobaIwaki123/taite-board.git
        targetRevision: '{{head_sha}}'
        path: k8s/manifests/preview
        kustomize:
          namespace: 'taite-board-pr-{{number}}'
          images:
            - 'ghcr.io/aobaiwaki123/taite-board:pr-{{number}}'
            - 'ghcr.io/aobaiwaki123/taite-board-monitor:pr-{{number}}'
          patches:
            - target:
                kind: Ingress
                name: ribonclock
              patch: |-
                - op: replace
                  path: /spec/rules/0/host
                  value: pr-{{number}}.taite.iorin.net
      destination:
        server: https://kubernetes.default.svc
        namespace: 'taite-board-pr-{{number}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
